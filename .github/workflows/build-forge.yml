name: Build TWMTW Pillars (Forge 1.18.2)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 7.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.1'
      - name: Build and reobfuscate Forge mod
        run: gradle --no-daemon --stacktrace build
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWMTW-Pillars-Forge-1.18.2
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Upload error logs (if build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-reports
          path: |
            build/reports/**
            build/tmp/**/logs/**
          if-no-files-found: ignore
